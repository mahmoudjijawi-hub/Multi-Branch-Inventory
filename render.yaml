# انشر عبر Blueprint: New + → Blueprint → اختَر هذا الريبو
# SQLite فقط — بدون PostgreSQL
services:
  - type: web
    name: inventory-system
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: USE_SQLITE
        value: "True"
