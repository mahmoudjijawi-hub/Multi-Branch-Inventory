<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ أمني - نظام إدارة المخزون</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; border-radius: 12px; padding: 2.5rem; max-width: 480px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
        h1 { color: #ef4444; font-size: 1.5rem; margin-bottom: .5rem; }
        p { color: #64748b; line-height: 1.7; }
        a { display: inline-block; margin-top: 1.5rem; padding: .7rem 1.5rem; background: #3b82f6; color: #fff; border-radius: 8px; text-decoration: none; }
        a:hover { background: #2563eb; }
        code { background: #f1f5f9; padding: .15rem .4rem; border-radius: 4px; font-size: .85rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔒 خطأ 403 — فشل التحقق الأمني</h1>
        <p>تعذّر إتمام الطلب. جرّب تحديث الصفحة ثم أعد المحاولة.</p>
        {% if reason %}
        <p><code>{{ reason }}</code></p>
        {% endif %}
        <a href="/login/">العودة لتسجيل الدخول</a>
    </div>
</body>
</html>
